<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Cosy 传屏 - 发送端</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .version-label {
      position: fixed;
      bottom: calc(8px + env(safe-area-inset-bottom));
      right: 12px;
      font-size: 11px;
      color: rgba(0,0,0,0.38);
      font-family: Roboto, sans-serif;
      z-index: 9999;
      pointer-events: none;
    }
    .info-list {
      margin: 24px 0;
      text-align: left;
    }
    .info-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid #EEEEEE;
    }
    .info-item:last-child {
      border-bottom: none;
    }
    .info-label {
      font-size: 14px;
      color: #757575;
    }
    .info-value {
      font-size: 15px;
      color: #212121;
      font-weight: 500;
      font-family: 'Consolas', 'Courier New', monospace;
      text-align: right;
      word-break: break-all;
    }
    #infoView {
      padding-top: 56px;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #debugLog {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.85);
      color: #0f0;
      font-family: monospace;
      font-size: 11px;
      padding: 8px;
      padding-top: calc(8px + env(safe-area-inset-top));
      overflow-y: auto;
      z-index: 99999;
      white-space: pre-wrap;
      word-break: break-all;
      display: none;
    }
    #debugToggle {
      position: fixed;
      top: 0;
      right: 0;
      width: 70px;
      height: 56px;
      z-index: 100000;
    }
  </style>
</head>
<body>
  <!-- 调试日志触发区 (双击右上角) -->
  <div id="debugToggle"></div>
  <div id="debugLog"></div>

  <div class="app-bar">
    <span class="app-title">Cosy 传屏</span>
  </div>

  <!-- 连接视图 -->
  <div id="connectView" class="container">
    <div class="card">
      <div class="card-header">
        <div class="logo">
          <svg viewBox="0 0 24 24" width="48" height="48"><path fill="#3F51B5" d="M21 3H3c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H3V5h18v14zM5 15h6v2H5z"/></svg>
        </div>
        <h1 class="headline">发送屏幕</h1>
        <p class="subhead">请输入接收端设备上显示的传屏码</p>
      </div>

      <div class="form-group">
        <div class="input-wrapper">
          <input type="text" id="codeInput" class="md-input" placeholder=" " autocomplete="off" spellcheck="false" autocapitalize="none" />
          <label for="codeInput" class="md-label">传屏码</label>
          <div class="underline"></div>
        </div>
      </div>

      <button id="connectBtn" class="md-btn md-btn-raised">
        连接
      </button>

      <div class="status-row" id="statusRow">
        <span class="status-dot" id="statusDot"></span>
        <span class="status-text" id="statusText">未连接</span>
      </div>

      <button id="disconnectBtn" class="md-btn md-btn-text hidden">
        断开连接
      </button>
    </div>
  </div>

  <!-- 信息视图 (连接成功 + SDK 验证通过后显示) -->
  <div id="infoView" class="container hidden">
    <div class="card">
      <div class="card-header">
        <div class="logo">
          <svg viewBox="0 0 24 24" width="48" height="48"><path fill="#4CAF50" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
        </div>
        <h1 class="headline">已连接</h1>
        <p class="subhead">接收端信息验证通过</p>
      </div>

      <div class="info-list">
        <div class="info-item">
          <span class="info-label">版本</span>
          <span class="info-value" id="receiverVersion">-</span>
        </div>
        <div class="info-item">
          <span class="info-label">系统</span>
          <span class="info-value" id="receiverOs">-</span>
        </div>
        <div class="info-item">
          <span class="info-label">IP 地址</span>
          <span class="info-value" id="receiverIp">-</span>
        </div>
      </div>

      <!-- 传屏源切换 (MD2 segmented button) -->
      <div class="source-switch">
        <span class="source-switch-label">传屏源</span>
        <div class="segmented" role="tablist">
          <button id="srcScreenBtn" class="seg-btn active" type="button" role="tab" aria-selected="true">
            <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M21 3H3c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H3V5h18v14zM5 15h6v2H5z"/></svg>
            <span>屏幕投射</span>
          </button>
          <button id="srcCameraBtn" class="seg-btn" type="button" role="tab" aria-selected="false">
            <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M9.4 10.5l4.77-8.26C13.47 2.09 12.75 2 12 2c-2.4 0-4.6.85-6.32 2.25l3.66 6.35.06-.1zM21.54 9c-.92-2.92-3.15-5.26-6-6.34L11.88 9h9.66zm.26 1h-7.49l.29.5 4.76 8.25C21 16.97 22 14.61 22 12c0-.69-.07-1.35-.2-2zM8.54 12l-3.9-6.75C3.01 7.03 2 9.39 2 12c0 .69.07 1.35.2 2h7.49l-1.15-2zm-6.08 3c.92 2.92 3.15 5.26 6 6.34L12.12 15H2.46zm11.27 0l-3.9 6.76c.7.15 1.42.24 2.17.24 2.4 0 4.6-.85 6.32-2.25l-3.66-6.35-.93 1.6z"/></svg>
            <span>摄像头</span>
          </button>
        </div>
      </div>

      <button id="shareBtn" class="md-btn md-btn-raised">
        传屏
      </button>

      <button id="stopShareBtn" class="md-btn md-btn-raised md-btn-warning hidden">
        停止传屏
      </button>

      <button id="disconnectBtn2" class="md-btn md-btn-text">
        断开连接
      </button>
    </div>
  </div>

  <div class="version-label">OpenCSS 1.0</div>

  <script>
    // 前端日志显示函数
    window._cosyLogs = [];
    window._cosyLog = function(msg) {
      var time = new Date().toLocaleTimeString();
      var line = '[' + time + '] ' + msg;
      window._cosyLogs.push(line);
      var el = document.getElementById('debugLog');
      if (el) {
        el.textContent = window._cosyLogs.join('\n') + '\n';
        el.scrollTop = el.scrollHeight;
      }
      try { console.log(line); } catch (e) {}
    };

    window.addEventListener('error', function(e) {
      window._cosyLog('JS错误: ' + e.message + ' @ ' + (e.filename||'') + ':' + (e.lineno||''));
    });

    window.addEventListener('unhandledrejection', function(e) {
      window._cosyLog('Promise未捕获: ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
    });

    window._cosyLog('HTML 已加载');

    // 双击右上角切换日志显示
    (function() {
      var toggle = document.getElementById('debugToggle');
      var logEl = document.getElementById('debugLog');
      var lastTap = 0;
      toggle.addEventListener('touchend', function() {
        var now = Date.now();
        if (now - lastTap < 400) {
          logEl.style.display = logEl.style.display === 'block' ? 'none' : 'block';
        }
        lastTap = now;
      });
      toggle.addEventListener('dblclick', function() {
        logEl.style.display = logEl.style.display === 'block' ? 'none' : 'block';
      });
    })();
  </script>
  <script src="renderer.js"></script>
</body>
</html>
