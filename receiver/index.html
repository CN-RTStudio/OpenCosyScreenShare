<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cosy 传屏 - 接收端</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .version-label {
      position: fixed;
      bottom: 8px;
      right: 12px;
      font-size: 11px;
      color: rgba(0,0,0,0.38);
      font-family: Roboto, sans-serif;
      z-index: 9999;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="app-bar">
    <span class="app-title">Cosy 传屏</span>
    <button id="exitBtn" class="md-btn md-btn-icon" title="退出">
      <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
    </button>
  </div>

  <div class="container">
    <div class="card">
      <div class="card-header">
        <div class="logo">
          <svg viewBox="0 0 24 24" width="48" height="48"><path fill="#3F51B5" d="M21 3H3c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H3V5h18v14zM5 15h6v2H5z"/></svg>
        </div>
        <h1 class="headline">准备接收</h1>
        <p class="subhead">将此传屏码分享给发送端设备</p>
      </div>

      <div class="code-box" id="codeBox">
        <span class="code-label">传屏码</span>
        <div class="code-value" id="codeValue">
          <span class="placeholder">正在生成...</span>
        </div>
      </div>

      <div class="status-row">
        <span class="status-dot" id="statusDot"></span>
        <span class="status-text" id="statusText">等待连接</span>
      </div>
    </div>
  </div>

  <div class="version-label">OpenCSS 1.0</div>

  <script src="renderer.js"></script>
</body>
</html>
