<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cosy 传屏 - 发送端</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .version-label {
      position: fixed;
      bottom: 8px;
      right: 12px;
      font-size: 11px;
      color: rgba(0,0,0,0.38);
      font-family: Roboto, sans-serif;
      z-index: 9999;
      pointer-events: none;
    }
    .info-list {
      margin: 24px 0;
      text-align: left;
    }
    .info-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid #EEEEEE;
    }
    .info-item:last-child {
      border-bottom: none;
    }
    .info-label {
      font-size: 14px;
      color: #757575;
    }
    .info-value {
      font-size: 15px;
      color: #212121;
      font-weight: 500;
      font-family: 'Consolas', 'Courier New', monospace;
    }
    #infoView {
      padding-top: 56px;
      min-height: 100vh;
    }
    #windowPickerView {
      padding-top: 56px;
      min-height: 100vh;
      overflow-y: auto;
    }
    #windowPickerView:not(.hidden) {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding-bottom: 24px;
    }
    #windowPickerView .card {
      width: 100%;
      max-width: 920px;
      max-height: calc(100vh - 80px);
      display: flex;
      flex-direction: column;
    }
    #windowPickerView .window-grid {
      flex: 1;
      overflow-y: auto;
      min-height: 0;
      padding-right: 4px;
    }
    #windowPickerView .picker-actions {
      flex-shrink: 0;
      padding-top: 12px;
      border-top: 1px solid rgba(0,0,0,0.06);
      margin-top: 12px;
      background: #fff;
    }
    .share-btn-group {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    .share-btn-group .md-btn {
      flex: 1;
    }
    .window-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin: 16px 0;
      max-height: 60vh;
      overflow-y: auto;
      padding: 4px;
    }
    .window-card {
      border: 2px solid #E0E0E0;
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      background: #fff;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .window-card:hover {
      border-color: #3F51B5;
      box-shadow: 0 2px 8px rgba(63,81,181,0.2);
    }
    .window-card.selected {
      border-color: #3F51B5;
      box-shadow: 0 0 0 2px rgba(63,81,181,0.3);
    }
    .window-card img {
      width: 100%;
      height: 120px;
      object-fit: cover;
      display: block;
      background: #000;
    }
    .window-card .window-name {
      padding: 8px 10px;
      font-size: 12px;
      color: #424242;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .picker-empty {
      text-align: center;
      color: #9E9E9E;
      padding: 40px 0;
      font-size: 14px;
    }
    .picker-actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }
    .picker-actions .md-btn {
      flex: 1;
    }
  </style>
</head>
<body>
  <div class="app-bar">
    <span class="app-title">Cosy 传屏</span>
    <button id="exitBtn" class="md-btn md-btn-icon" title="退出">
      <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
    </button>
  </div>

  <div class="container">
    <div class="card">
      <div class="card-header">
        <div class="logo">
          <svg viewBox="0 0 24 24" width="48" height="48"><path fill="#3F51B5" d="M21 3H3c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H3V5h18v14zM5 15h6v2H5z"/></svg>
        </div>
        <h1 class="headline">发送屏幕</h1>
        <p class="subhead">请输入接收端设备上显示的传屏码</p>
      </div>

      <div class="form-group">
        <div class="input-wrapper">
          <input type="text" id="codeInput" class="md-input" placeholder=" " autocomplete="off" spellcheck="false" />
          <label for="codeInput" class="md-label">传屏码</label>
          <div class="underline"></div>
        </div>
      </div>

      <button id="connectBtn" class="md-btn md-btn-raised">
        连接
      </button>

      <div class="status-row" id="statusRow">
        <span class="status-dot" id="statusDot"></span>
        <span class="status-text" id="statusText">未连接</span>
      </div>

      <button id="disconnectBtn" class="md-btn md-btn-text hidden">
        断开连接
      </button>
    </div>
  </div>

  <!-- Info view (shown after successful connection + SDK validation) -->
  <div id="infoView" class="container hidden">
    <div class="card">
      <div class="card-header">
        <div class="logo">
          <svg viewBox="0 0 24 24" width="48" height="48"><path fill="#4CAF50" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
        </div>
        <h1 class="headline">已连接</h1>
        <p class="subhead">接收端信息验证通过</p>
      </div>

      <div class="info-list">
        <div class="info-item">
          <span class="info-label">版本</span>
          <span class="info-value" id="receiverVersion">-</span>
        </div>
        <div class="info-item">
          <span class="info-label">系统</span>
          <span class="info-value" id="receiverOs">-</span>
        </div>
        <div class="info-item">
          <span class="info-label">IP 地址</span>
          <span class="info-value" id="receiverIp">-</span>
        </div>
      </div>

      <div class="share-btn-group">
        <button id="shareBtn" class="md-btn md-btn-raised">
          屏幕投屏
        </button>
        <button id="windowShareBtn" class="md-btn md-btn-raised">
          窗口投屏
        </button>
      </div>

      <button id="stopShareBtn" class="md-btn md-btn-raised md-btn-warning hidden">
        停止传输
      </button>

      <button id="disconnectBtn2" class="md-btn md-btn-text">
        断开连接
      </button>
    </div>
  </div>

  <!-- Window picker view -->
  <div id="windowPickerView" class="container hidden">
    <div class="card">
      <div class="card-header">
        <div class="logo">
          <svg viewBox="0 0 24 24" width="48" height="48"><path fill="#3F51B5" d="M19 19V5c0-1.1-.9-2-2-2H7c-1.1 0-2 .9-2 2v14H3v2h18v-2h-2zm-2 0H7V5h10v14z"/></svg>
        </div>
        <h1 class="headline">选择窗口</h1>
        <p class="subhead">点击要投屏的窗口，然后开始传屏</p>
      </div>

      <div id="windowGrid" class="window-grid"></div>

      <div class="picker-actions">
        <button id="pickerBackBtn" class="md-btn md-btn-text">
          返回
        </button>
        <button id="pickerShareBtn" class="md-btn md-btn-raised" disabled>
          开始投屏
        </button>
      </div>
    </div>
  </div>

  <div class="version-label">OpenCSS 1.0</div>

  <script src="renderer.js"></script>
</body>
</html>
